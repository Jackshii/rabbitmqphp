[loginServer]
BROKER_HOST = rabbitBroker
BROKER_PORT = 5671
VHOST = authVHost
EXCHANGE = authExchange
QUEUE = loginQueue
EXCHANGE_TYPE = direct
ROUTING_KEY = login
AUTO_DELETE = false
CACERT = /etc/rabbitmq_client/CA.crt

[registrationServer]
BROKER_HOST = rabbitBroker
BROKER_PORT = 5671
VHOST = authVHost
EXCHANGE = authExchange
QUEUE = registrationQueue
EXCHANGE_TYPE = direct
ROUTING_KEY = registration
AUTO_DELETE = false
CACERT = /etc/rabbitmq_client/CA.crt

