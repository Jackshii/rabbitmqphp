[dmzServer]
BROKER_HOST = rabbitBroker
BROKER_PORT = 5671
VHOST = apiVHost
EXCHANGE = apiExchange
QUEUE = dmzQueue
EXCHANGE_TYPE = direct
ROUTING_KEY = dmz
AUTO_DELETE = false
CACERT = /etc/rabbitmq_client/CA.crt

[dataServer]
BROKER_HOST = rabbitBroker
BROKER_PORT = 5671
VHOST = apiVHost
EXCHANGE = apiExchange
QUEUE = dataQueue
EXCHANGE_TYPE = direct
ROUTING_KEY = data
AUTO_DELETE = false
CACERT = /etc/rabbitmq_client/CA.crt
